# Fly.io configuration for Fashion AI backend
app = "fashion-ai-backend"
primary_region = "ams"

[build]
  builder = "heroku"

[build.args]
  NODE_ENV = "production"

[env]
  NODE_ENV = "production"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  min_machines_running = 1

[http_service.concurrency]
  type = "requests"
  hard_limit = 1000
  soft_limit = 800

[[services]]
  internal_port = 3000
  processes = ["app"]
  
  [services.http_checks]
    enabled = true
    grace_period = "30s"
    interval = "15s"
    timeout = "5s"
    path = "/api/health"

[deploy]
  release_command = "node -e \"console.log('Release command completed')\""
  strategy = "rolling"
